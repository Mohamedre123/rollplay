<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#780d18" />
  <meta name="description" content="Acceso a El Mundo Hispano" />
  <title>Acceso | El Mundo Hispano</title>
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <main class="auth-shell">
    <section class="auth-art" aria-hidden="true"><div class="auth-orb orb-one"></div><div class="auth-orb orb-two"></div><div class="auth-pattern"></div><p>EL MUNDO<br><em>HISPANO</em></p><span>Aprender · Hablar · Conectar</span></section>
    <section class="auth-panel" aria-labelledby="auth-title">
      <div class="auth-top"><a class="auth-logo" href="/" aria-label="Volver a El Mundo Hispano"><img src="assets/elm-logo.png" alt="El Mundo Hispano" /></a><a class="auth-home" href="/">Volver al inicio <span>→</span></a></div>
      <div id="startView">
        <p class="eyebrow">Plataforma El Mundo Hispano</p><h1 id="auth-title">Bienvenido/a</h1><p class="lead">Entra con el correo y la contraseña que te dio tu profesor/a.</p>
        <form id="loginForm" novalidate>
          <div class="field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" autocomplete="username" inputmode="email" placeholder="name@example.com" required /></div>
          <div class="field password-field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Tu contraseña" required /><button class="show-password" id="showPassword" type="button" aria-label="Mostrar contraseña" aria-pressed="false">Ver</button></div>
          <button class="primary-button" id="loginButton" type="submit"><span>Entrar</span><b>→</b></button>
        </form>
        <p class="privacy">¿No tienes cuenta o olvidaste tu contraseña? Pídesela a tu profesor/a: las cuentas las crea la academia.</p>
      </div>
      <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="auth.js" defer></script>
</body></html>
